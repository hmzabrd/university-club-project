            rel="stylesheet"
        />
        <title>CIK | Club Ibn Khaldoun — FSBM</title>

        <!-- Restores the correct URL after the 404.html redirect on GitHub Pages -->
        <script>
            (function (l) {
                if (l.search[1] === "/") {
                    var decoded = l.search
                        .slice(1)
                        .split("&")
                        .map(function (s) {
                            return s.replace(/~and~/g, "&");
                        });
                    window.history.replaceState(
                        null,
                        null,
                        l.pathname.slice(0, -1) +
                            decoded[0] +
                            (decoded[1] ? "?" + decoded[1] : "") +
                            l.hash,
                    );
                }
            })(window.location);
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.jsx"></script>
    </body>
