<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CIK | Club Ibn Khaldoun</title>
  <script>
    // GitHub Pages does not support SPA routing out of the box.
    // This file catches any 404 and redirects back to index.html
    // while encoding the original path so React Router can restore it.
    var segmentsToKeep = 1;
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + segmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(segmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
